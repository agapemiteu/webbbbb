<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Enable Webb microphone</title></head>
  <body style="font:16px system-ui,sans-serif;max-width:440px;margin:10vh auto;padding:24px;color:#17231e">
    <h1 style="font-size:24px">Enable Webb microphone</h1>
    <p>Chrome asks for microphone access in this tab. Choose Allow, then return to Webb and press its microphone button.</p>
    <button id="enable" style="border:0;border-radius:10px;background:#286cf0;color:white;padding:12px 18px;font:inherit;cursor:pointer">Allow microphone</button>
    <p id="status" role="status"></p>
    <script type="module" src="./microphone/main.ts"></script>
  </body>
</html>
